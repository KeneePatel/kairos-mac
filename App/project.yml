# Generates App/Kairos.xcodeproj (gitignored): run `xcodegen generate` in App/.
name: Kairos
options:
  bundleIdPrefix: com.keneepatel
  deploymentTarget:
    macOS: "26.0"
  createIntermediateGroups: true
packages:
  KairosCore:
    path: ../Packages/KairosCore
settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    SWIFT_TREAT_WARNINGS_AS_ERRORS: YES
    GCC_TREAT_WARNINGS_AS_ERRORS: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  Kairos:
    type: application
    platform: macOS
    sources:
      - path: Kairos
      # The one bundled binary (CONSTRAINTS.md): fetched by scripts/fetch-typst.sh, copied into
      # Contents/MacOS and signed with the app. It runs inside the app's sandbox.
      - path: ../Vendor/typst/typst
        buildPhase:
          copyFiles:
            destination: executables
        attributes: [CodeSignOnCopy]
    dependencies:
      - package: KairosCore
        product: Store
      - package: KairosCore
        product: Render
      - package: KairosCore
        product: Secrets
    info:
      path: Kairos/Info.plist
      properties:
        CFBundleDisplayName: Kairos
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.productivity
        NSHumanReadableCopyright: Copyright © 2026 Kenee Patel. MIT License.
        CFBundleURLTypes:
          - CFBundleURLName: com.keneepatel.kairos
            CFBundleURLSchemes: [kairos]
    entitlements:
      path: Kairos/Kairos.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.files.user-selected.read-write: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.keneepatel.kairos
        # Colours come from Assets.xcassets (generated by scripts/gen-tokens.swift) through
        # Xcode's generated symbols, e.g. Color(.inkSecondary).
        ASSETCATALOG_COMPILER_GENERATE_SWIFT_ASSET_SYMBOL_EXTENSIONS: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Ad-hoc by default. Release and spike builds pass KAIROS_SIGNING_IDENTITY="Kairos Local Signing"
        # (docs/signing.md); it only reaches this target, so package resource bundles stay unsigned.
        CODE_SIGN_STYLE: Manual
        KAIROS_SIGNING_IDENTITY: "-"
        CODE_SIGN_IDENTITY: $(KAIROS_SIGNING_IDENTITY)
        ENABLE_HARDENED_RUNTIME: YES
